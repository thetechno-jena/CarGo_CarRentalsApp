<!DOCTYPE html>
<html>
<head>
  <title>CarGo Auth</title>

  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css"> 
<link rel="stylesheet" href="css/style.css">
<script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
<script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>

  <!-- LOGIN PAGE -->
<div data-role="page" id="loginPage">
  <div data-role="header">
    <h1>CarGo Login</h1>
  </div>
  <div class="form-logo">
  <img src="./www/images/cargo-logo.png" alt="CarGo Logo">
</div>

  <div data-role="main" class="ui-content">
    <label>Email:</label>
    <input type="email" id="loginEmail">

    <label>Password:</label>
    <input type="password" id="loginPassword">

    <button id="loginBtn">Login</button>
    <a href="#signupPage" data-role="button">Sign Up</a>
    <!-- forgot password rest button -->
     <p style="text-align:right;">
  <a href="#forgotPasswordPage">Forgot Password?</a>
</p>

    <p id="loginMsg"></p>
  </div>
</div>


<!-- SIGN UP PAGE -->
<div data-role="page" id="signupPage">
  <div data-role="header">
    <h1>Sign Up</h1>
  </div>
  <div class="form-logo">
  <img src="./www/images/cargo-logo.png" alt="CarGo Logo">
</div>

  <div data-role="main" class="ui-content">
    <label>Full Name:</label>
    <input type="text" id="fullName">

    <label>Email:</label>
    <input type="email" id="signupEmail">

    <label>Password:</label>
    <input type="password" id="signupPassword">

    <label>Confirm Password:</label>
    <input type="password" id="confirmPassword">

    <button type="button" id="signupBtn">Sign Up</button>

    <a href="#loginPage">Already have an account? Login</a>

    <p id="signupMsg"></p>
  </div>
</div>

<!-- forgot password -->

<div data-role="page" id="forgotPasswordPage">
  <div data-role="header">
    <a href="#loginPage" data-icon="back">Back</a>
    <h1>Reset Password</h1>
  </div>

  <div data-role="main" class="ui-content">
    <label>Email:</label>
    <input type="email" id="forgotEmail">

    <button id="resetPasswordBtn">Reset Password</button>

    <p id="forgotMsg"></p>
  </div>
</div>



<!-- home page navigation bar-->
<!-- HOME PAGE -->
 <div data-role="page" id="homePage">
  <div data-role="header">
    <h1>CarGo Home</h1>
  </div>

  <div data-role="main" class="ui-content">
    <h2>Welcome to CarGo</h2>
  </div>
</div>

</body>
</html>
